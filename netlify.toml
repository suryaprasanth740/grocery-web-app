# Optional: serve the NammaBasket pages from Netlify.
# The Java backend + PostgreSQL stay on Render; Netlify serves the HTML/CSS/JS and
# forwards every /api/* request to Render. The browser only ever talks to the
# Netlify domain, so the login session cookie keeps working with no code changes.
#
# Point the "to" line below at YOUR Render service URL (Render dashboard -> your service).

[build]
  publish = "src/main/resources/static"
  command = "echo 'Static frontend - no build step'"

# Proxy the REST API to the Spring Boot backend on Render (status 200 = rewrite, not redirect).
[[redirects]]
  from = "/api/*"
  to = "https://grocery-web-app-fb3j.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    # Same policy as SecurityHeadersFilter.java in the app
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
