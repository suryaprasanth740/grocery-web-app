# ============================================================
# Grocery Web Application - configuration
#
# Local development: no setup needed. The app defaults to an
#   in-memory H2 database, so `mvn spring-boot:run` just works.
#
# Production (Render, etc.): set these environment variables and
#   the app automatically switches to your real MySQL database:
#   DB_URL       e.g. jdbc:postgresql://ep-xxx.aws.neon.tech/neondb?sslmode=require
#                (free, permanent PostgreSQL from neon.tech) - or a jdbc:mysql:// URL
#   DB_USER      your database username
#   DB_PASSWORD  your MySQL password
# ============================================================

spring.datasource.url=${DB_URL:jdbc:h2:mem:grocerydb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Auto create/update tables from the JPA entities. Fine for a student/portfolio
# project; a real production system would use versioned migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}

# Session cookie used for login state
server.servlet.session.timeout=60m

logging.level.org.hibernate.SQL=warn

# ============================================================
# Shop rules (change them here - the code reads these values)
# ============================================================
# Delivery fee, and the order value above which delivery is free
app.delivery.fee=30
app.delivery.free-above=500
# We deliver only to PIN codes that start with these digits (comma separated). 560 = Bengaluru
app.delivery.pincode-prefixes=560
app.delivery.eta=30-45 min
# Cash on delivery is not allowed above this order total (fraud / return risk)
app.cod.max-amount=3000
# Max quantity of one product in the cart
app.cart.max-qty-per-item=20
# An unpaid UPI order is cancelled (and its stock released) after this many minutes
app.upi.timeout-minutes=10
# Customers can report a missing / damaged item for this many hours after delivery
app.issue.window-hours=48
# Login protection: lock the account for 15 min after 5 wrong passwords
app.login.max-attempts=5
app.login.lock-minutes=15
# Admin account created on start-up. Set ADMIN_PASSWORD on Render!
# If it is not set, a random password is generated and printed in the logs.
app.admin.email=${ADMIN_EMAIL:admin@freshcart.com}
app.admin.password=${ADMIN_PASSWORD:}
app.demo.refresh-expired-stock=true
