# ============================================================
# NammaBasket - configuration
#
# Every value that differs between computers or environments comes from an
# environment variable, with a safe default for local development.
# All variables are listed in .env.example and in the README.
#
# Local development: no setup needed. Without DB_URL the app uses an in-memory
#   H2 database in PostgreSQL mode, so `mvn spring-boot:run` just works.
# Production: set DB_URL / DB_USER / DB_PASSWORD to a PostgreSQL database, e.g.
#   DB_URL=jdbc:postgresql://ep-xxx.aws.neon.tech/neondb?sslmode=require
# ============================================================

spring.datasource.url=${DB_URL:jdbc:h2:mem:nammabasket;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Tables are created and changed ONLY by Flyway migrations in src/main/resources/db/migration.
# Hibernate just checks at start-up that the tables match the entities (and stops the app if not).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}

# Session cookie used for login state
server.servlet.session.timeout=60m
# The browser never lets page scripts read the cookie, and won't send it on cross-site posts
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Send the session cookie over HTTPS only. Set COOKIE_SECURE=true in production (HTTPS);
# keep false for http://localhost.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

logging.level.org.hibernate.SQL=warn

# ============================================================
# Shop rules (change them here - the code reads these values)
# ============================================================
# Delivery fee, and the order value above which delivery is free
app.delivery.fee=30
app.delivery.free-above=500
# We deliver only to PIN codes that start with these digits (comma separated). 560 = Bengaluru
app.delivery.pincode-prefixes=560
app.delivery.eta=30-45 min
# Cash on delivery is not allowed above this order total (fraud / return risk)
app.cod.max-amount=3000
# Max quantity of one product in the cart
app.cart.max-qty-per-item=20
# An unpaid UPI order is cancelled (and its stock released) after this many minutes
app.upi.timeout-minutes=10
# Customers can report a missing / damaged item for this many hours after delivery
app.issue.window-hours=48
# Login protection: lock the account for 15 min after 5 wrong passwords
app.login.max-attempts=5
app.login.lock-minutes=15
# Admin account created on start-up. Set ADMIN_PASSWORD on Render!
# If it is not set, a random password is generated and printed in the logs.
app.admin.email=${ADMIN_EMAIL:admin@nammabasket.local}
app.admin.password=${ADMIN_PASSWORD:}
app.demo.refresh-expired-stock=true
# Three extra demo shops (vegetables, provisions, dairy & bakery) so the marketplace has several shops.
app.demo.marketplace-shops=${DEMO_SHOPS:true}
# Password for the demo shop owners (e.g. hasiru.tarkari@demo.nammabasket.in). Empty = random, no login.
app.demo.seller-password=${DEMO_SELLER_PASSWORD:}

# Photo uploads: the browser shrinks photos first; the server allows at most 300 KB per photo.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
