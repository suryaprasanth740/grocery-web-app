<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders &mdash; FreshCart</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard">
  <div class="wrap">
    <a href="/" class="brand"><span class="crate">&#127811;</span>FreshCart</a>
    <nav class="nav-links">
      <a href="/products.html">Shop</a>
      <a href="/orders.html" id="nav-orders" style="display:none">My Orders</a>
      <span id="nav-auth-area"><a href="/login.html" id="nav-login">Login</a></span>
      <a href="/cart.html" class="cart-pill">&#128722; Cart <span class="count" id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap" style="max-width:720px;">
    <div class="section-heading" style="margin-top:34px;">
      <h2>My orders</h2>
    </div>
    <div id="orders-root">
      <div class="skeleton" style="height:120px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:120px;"></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    FreshCart &mdash; a student full-stack demo project. Built with Spring Boot, MySQL, and vanilla JS by
    <a href="https://github.com/suryaprasanth740" target="_blank" rel="noopener">Surya Prasanth</a>.
  </div>
</footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('orders-root');

  try {
    await API.me();
  } catch (e) {
    window.location.href = '/login.html?next=/orders.html';
    return;
  }

  try {
    const orders = await API.orders();
    if (orders.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="big-emoji">&#128230;</div>
          <h3>No orders yet</h3>
          <p>Once you place an order, it'll show up here.</p>
          <a href="/products.html" class="btn btn-primary mt-40">Start shopping</a>
        </div>`;
      return;
    }
    root.innerHTML = orders.map(o => `
      <a href="/order.html?id=${o.id}" class="order-card" style="display:block;">
        <div class="top-row">
          <div>
            <div class="order-id">Order #${o.id}</div>
            <div class="date">${formatDateTime(o.createdAt)}</div>
          </div>
          ${statusBadgeHtml(o.status)}
        </div>
        <div class="order-items-list">
          ${o.items.slice(0, 3).map(it => `<div class="order-line"><span>${escapeHtml(it.productName)} &times; ${it.quantity}</span></div>`).join('')}
          ${o.items.length > 3 ? `<div class="order-line">+ ${o.items.length - 3} more item(s)</div>` : ''}
        </div>
        <div class="summary-row total" style="margin-top:8px;"><span>Total</span><span>${formatRupees(o.totalAmount)}</span></div>
      </a>
    `).join('');
  } catch (e) {
    root.innerHTML = `<p>Could not load your orders. ${escapeHtml(e.message)}</p>`;
  }
});
</script>
</body>
</html>
