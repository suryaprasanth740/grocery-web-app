<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | NammaBasket</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard" id="site-header"></header>

<main id="main">
  <div class="wrap" style="max-width:640px;">
    <div class="section-heading" style="margin-top:34px;">
      <h1>Checkout</h1>
    </div>
    <div id="checkout-root">
      <div class="skeleton" style="height:220px;"></div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', init);

// One id per checkout attempt. If the button is clicked twice, or the network retries,
// the server sees the same id and returns the same order instead of creating two.
const REQUEST_ID = newRequestId();
let appliedCoupon = null;
let currentBill = null;
let pincodeOk = false;
let pincode = (NBLocation.get() || {}).pincode || '';

/** Delivery/pickup per shop, exactly as the bill shows it. */
function fulfilmentChoices() {
  const out = {};
  (currentBill ? currentBill.shops : []).forEach(sb => { if (sb.shopId) out[sb.shopId] = sb.fulfilment; });
  return Object.keys(out).length ? out : NBChoices.all();
}
function needsDelivery() {
  return currentBill.shops.some(sb => sb.fulfilment === 'DELIVERY');
}
async function refreshBill() {
  currentBill = await API.quote(appliedCoupon, fulfilmentChoices(), pincode.length === 6 ? pincode : null);
}

async function init() {
  const root = document.getElementById('checkout-root');
  try {
    await API.me();
  } catch (e) {
    window.location.href = '/login.html?next=/checkout.html';
    return;
  }

  try {
    currentBill = await API.quote(null, NBChoices.all(), null);
  } catch (e) {
    root.innerHTML = '<p>Could not load your cart.</p>';
    return;
  }

  if (currentBill.lines.length === 0) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="big-emoji">&#128722;</div>
        <h3>Your cart is empty</h3>
        <p>Add something to your cart before checking out.</p>
        <a href="/products.html" class="btn btn-primary mt-40">Browse products</a>
      </div>`;
    return;
  }
  if (currentBill.problems.length > 0) {
    root.innerHTML = `
      <div class="alert alert-error">Your cart needs attention:
        <ul>${currentBill.problems.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
      </div>
      <a href="/cart.html" class="btn btn-primary">Back to cart</a>`;
    return;
  }

  root.innerHTML = `
    <div class="cart-summary" style="position:static;margin-bottom:24px;">
      <h3 style="font-size:1.05rem;margin-bottom:14px;">${currentBill.shops.length > 1 ? `${currentBill.shops.length} shops, one payment` : 'Your order'}</h3>
      <div id="shop-summaries"></div>
      <hr class="soft">
      <div class="field coupon-field">
        <label for="coupon">Coupon code</label>
        <div class="inline-row">
          <input id="coupon" type="text" maxlength="30" placeholder="e.g. FRESH50" autocomplete="off">
          <button type="button" class="btn btn-outline" id="coupon-btn">Apply</button>
        </div>
        <div id="coupon-msg" class="field-msg"></div>
      </div>
      <div id="bill-rows"></div>
    </div>

    <form id="checkout-form" novalidate>
      <div id="checkout-error"></div>

      <div class="field">
        <label for="pincode">Your PIN code</label>
        <div class="inline-row">
          <input id="pincode" type="text" inputmode="numeric" maxlength="6" placeholder="6 digits, e.g. 560073" autocomplete="postal-code">
          <button type="button" class="btn btn-outline" id="pincode-btn">Check</button>
        </div>
        <div id="pincode-msg" class="field-msg"></div>
      </div>

      <div class="field" id="address-field">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="3" maxlength="300" placeholder="House / flat no., street, area, landmark"></textarea>
        <div class="field-msg muted"><span id="address-count">0</span>/300 characters (at least 10)</div>
      </div>

      <div class="field">
        <label>If an item is out of stock while packing</label>
        <div class="choice-list">
          <label class="choice"><input type="radio" name="subst" value="REFUND_ITEM" checked> Refund that item</label>
          <label class="choice"><input type="radio" name="subst" value="REPLACE_SIMILAR"> Replace with a similar item (same or lower price)</label>
          <label class="choice"><input type="radio" name="subst" value="CALL_ME"> Call me first</label>
        </div>
      </div>

      <div id="slot-fields"></div>

      <div class="field">
        <label>Payment method</label>
        <div class="choice-list" id="payment-choices"></div>
      </div>

      <button type="submit" class="btn btn-accent btn-block" id="place-order-btn" disabled>Place order</button>
      <div class="field-msg muted center" id="place-hint" style="margin-top:8px;">Enter your PIN code to continue.</div>
    </form>
  `;

  renderBill();
  wireCoupon();
  wirePincode();
  if (pincode) {
    document.getElementById('pincode').value = pincode;
    document.getElementById('pincode').dispatchEvent(new Event('input'));
  }
  const address = document.getElementById('address');
  address.addEventListener('input', () => {
    document.getElementById('address-count').textContent = address.value.length;
  });
  document.getElementById('checkout-form').addEventListener('submit', placeOrder);
  loadSlots();
}

// ---------- Time slots (only for shops that offer them) ----------
const slotChoices = {}; // {shopId: "2026-10-14T17:00"}; missing = as soon as possible

async function loadSlots() {
  const box = document.getElementById('slot-fields');
  if (!box) return;
  const shops = currentBill.shops.filter(sb => sb.shopId);
  const results = await Promise.all(shops.map(sb => API.shopSlots(sb.shopId).catch(() => null)));
  box.innerHTML = shops.map((sb, i) => {
    const r = results[i];
    if (!r || !r.enabled) return '';
    const open = r.days.some(d => d.slots.some(s => !s.full));
    if (slotChoices[sb.shopId] && !r.days.some(d => d.slots.some(s => s.value === slotChoices[sb.shopId] && !s.full))) {
      delete slotChoices[sb.shopId]; // that slot closed or filled up
    }
    const how = sb.fulfilment === 'PICKUP' ? 'Pickup' : 'Delivery';
    return `<div class="field">
      <label for="slot-${sb.shopId}">${how} time from ${escapeHtml(sb.shopName)}</label>
      <select id="slot-${sb.shopId}" data-slot-shop="${sb.shopId}">
        <option value="">As soon as possible</option>
        ${r.days.filter(d => d.slots.length).map(d => `<optgroup label="${d.label}">
          ${d.slots.map(s => `<option value="${s.value}" ${s.full ? 'disabled' : ''} ${slotChoices[sb.shopId] === s.value ? 'selected' : ''}>
            ${d.label}, ${escapeHtml(s.label)}${s.full ? ' (full)' : s.placesLeft <= 2 ? ` (${s.placesLeft} left)` : ''}</option>`).join('')}
        </optgroup>`).join('')}
      </select>
      <div class="field-msg muted">${open ? '2-hour slots. Slots close an hour before they start.' : 'No slots left today or tomorrow, so the order will be prepared as soon as possible.'}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('select[data-slot-shop]').forEach(sel => sel.addEventListener('change', () => {
    if (sel.value) slotChoices[sel.dataset.slotShop] = sel.value; else delete slotChoices[sel.dataset.slotShop];
  }));
}

function renderBill() {
  if (appliedCoupon && !currentBill.couponApplied) {
    // The coupon stopped working (e.g. expired, or items removed below the minimum).
    appliedCoupon = null;
    const input = document.getElementById('coupon');
    input.disabled = false;
    document.getElementById('coupon-btn').textContent = 'Apply';
    const msg = document.getElementById('coupon-msg');
    msg.className = 'field-msg error';
    msg.textContent = currentBill.couponMessage || 'The coupon no longer applies.';
  }
  document.getElementById('bill-rows').innerHTML = billRowsHtml(currentBill);
  document.getElementById('shop-summaries').innerHTML = currentBill.shops.map(sb => `
    <div class="summary-row" style="color:var(--ink);font-weight:700;margin-top:6px;">
      <span>${escapeHtml(sb.shopName)} <span class="muted small" style="font-weight:600;">(${sb.fulfilment === 'PICKUP' ? 'pickup from shop' : 'delivery'})</span></span>
      <span>${formatRupees(sb.total)}</span></div>
    ${sb.lines.map(l => `<div class="summary-row"><span>${escapeHtml(l.name)} &times; ${l.quantity}</span><span>${formatRupees(l.lineTotal)}</span></div>`).join('')}
    ${sb.problems.length ? `<div class="group-problems">${sb.problems.map(p => escapeHtml(p)).join('<br>')}</div>` : ''}
  `).join('<hr class="soft">');
  const addressField = document.getElementById('address-field');
  if (addressField) addressField.hidden = !needsDelivery();

  const choices = document.getElementById('payment-choices');
  const previous = document.querySelector('input[name="pay"]:checked');
  let selected = previous ? previous.value : 'UPI';
  if (!currentBill.codAllowed && selected === 'COD') selected = 'UPI';
  choices.innerHTML = `
    <label class="choice"><input type="radio" name="pay" value="UPI" ${selected === 'UPI' ? 'checked' : ''}>
      UPI <span class="muted">(demo &mdash; you choose success or failure)</span></label>
    <label class="choice ${currentBill.codAllowed ? '' : 'disabled'}"><input type="radio" name="pay" value="COD"
      ${selected === 'COD' ? 'checked' : ''} ${currentBill.codAllowed ? '' : 'disabled'}>
      Cash on delivery ${currentBill.codAllowed ? '' : `<span class="muted">(only for orders up to ${formatRupees(currentBill.codMaxAmount)})</span>`}</label>
  `;
  updatePlaceButton();
}

function updatePlaceButton() {
  const btn = document.getElementById('place-order-btn');
  btn.disabled = !pincodeOk;
  const hint = document.getElementById('place-hint');
  if (hint) hint.style.display = pincodeOk ? 'none' : '';
  btn.textContent = `Place order · ${formatRupees(currentBill.total)}`;
}

function wireCoupon() {
  const input = document.getElementById('coupon');
  const btn = document.getElementById('coupon-btn');
  const msg = document.getElementById('coupon-msg');

  btn.addEventListener('click', async () => {
    if (appliedCoupon) { // "Remove"
      appliedCoupon = null;
      input.value = '';
      input.disabled = false;
      btn.textContent = 'Apply';
      msg.textContent = '';
      await refreshBill();
      renderBill();
      return;
    }
    const code = input.value.trim();
    if (!code) { msg.className = 'field-msg error'; msg.textContent = 'Enter a coupon code.'; return; }
    btn.disabled = true;
    try {
      const bill = await API.quote(code, fulfilmentChoices(), pincode.length === 6 ? pincode : null);
      if (bill.couponApplied) {
        appliedCoupon = bill.couponCode;
        currentBill = bill;
        input.value = bill.couponCode;
        input.disabled = true;
        btn.textContent = 'Remove';
        msg.className = 'field-msg ok';
      } else {
        msg.className = 'field-msg error';
      }
      msg.textContent = bill.couponMessage || '';
      renderBill();
    } catch (e) {
      msg.className = 'field-msg error';
      msg.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });
}

function wirePincode() {
  const input = document.getElementById('pincode');
  const msg = document.getElementById('pincode-msg');
  const check = async () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    pincodeOk = false;
    updatePlaceButton();
    if (input.value.length < 6) {
      msg.className = 'field-msg';
      msg.textContent = '';
      return;
    }
    try {
      pincode = input.value;
      await refreshBill();
      renderBill();
      const areaProblems = currentBill.problems.filter(p => p.includes("doesn't deliver to"));
      pincodeOk = currentBill.problems.length === 0;
      if (areaProblems.length) {
        msg.className = 'field-msg error';
        msg.textContent = areaProblems.join(' ');
      } else if (!pincodeOk) {
        msg.className = 'field-msg error';
        msg.textContent = currentBill.problems[0];
      } else {
        msg.className = 'field-msg ok';
        msg.textContent = needsDelivery() ? `Delivery to ${pincode} is available.` : 'Pickup only, so no delivery needed.';
        NBLocation.check(pincode).catch(() => {});
      }
    } catch (e) {
      msg.className = 'field-msg error';
      msg.textContent = e.message;
    }
    updatePlaceButton();
  };
  input.addEventListener('input', check);
  document.getElementById('pincode-btn').addEventListener('click', check);
}

async function placeOrder(e) {
  e.preventDefault();
  const btn = document.getElementById('place-order-btn');
  const errorBox = document.getElementById('checkout-error');
  errorBox.innerHTML = '';

  const address = document.getElementById('address').value.trim();
  const pincode = document.getElementById('pincode').value.trim();
  if (needsDelivery() && address.length < 10) {
    errorBox.innerHTML = '<div class="alert alert-error">Please enter your full address (at least 10 characters).</div>';
    return;
  }
  if (!pincodeOk) return;

  btn.disabled = true; // first protection against double clicks (the server has the real one)
  btn.textContent = 'Placing order...';
  try {
    const placed = await API.checkout({
      requestId: REQUEST_ID,
      shippingAddress: needsDelivery() ? address : null,
      pincode,
      fulfilment: fulfilmentChoices(),
      slots: slotChoices,
      paymentMethod: document.querySelector('input[name="pay"]:checked').value,
      couponCode: appliedCoupon,
      substitutionPreference: document.querySelector('input[name="subst"]:checked').value,
      expectedTotal: currentBill.total,
    });
    refreshCartCount();
    const first = placed.orders[0];
    const next = first.status === 'PAYMENT_PENDING' ? 'pay=1' : 'justPlaced=1';
    window.location.href = `/order.html?id=${first.id}&${next}`;
  } catch (err) {
    errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    if (err.status === 409) {
      // Bill changed (price / stock / coupon). Show the fresh bill.
      try { await refreshBill(); renderBill(); await loadSlots(); } catch (_) { /* ignore */ }
    }
    updatePlaceButton();
    errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
</script>
</body>
</html>
