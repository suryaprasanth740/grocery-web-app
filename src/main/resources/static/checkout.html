<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout &mdash; FreshCart</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard">
  <div class="wrap">
    <a href="/" class="brand"><span class="crate">&#127811;</span>FreshCart</a>
    <nav class="nav-links">
      <a href="/products.html">Shop</a>
      <a href="/orders.html" id="nav-orders" style="display:none">My Orders</a>
      <span id="nav-auth-area"><a href="/login.html" id="nav-login">Login</a></span>
      <a href="/cart.html" class="cart-pill">&#128722; Cart <span class="count" id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap" style="max-width:640px;">
    <div class="section-heading" style="margin-top:34px;">
      <h2>Checkout</h2>
    </div>
    <div id="checkout-root">
      <div class="skeleton" style="height:220px;"></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    FreshCart &mdash; a student full-stack demo project. Built with Spring Boot, MySQL, and vanilla JS by
    <a href="https://github.com/suryaprasanth740" target="_blank" rel="noopener">Surya Prasanth</a>.
  </div>
</footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', init);

async function init() {
  const root = document.getElementById('checkout-root');
  try {
    await API.me();
  } catch (e) {
    window.location.href = '/login.html?next=/checkout.html';
    return;
  }

  let items;
  try {
    items = await API.cart();
  } catch (e) {
    root.innerHTML = '<p>Could not load your cart.</p>';
    return;
  }

  if (items.length === 0) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="big-emoji">&#128722;</div>
        <h3>Your cart is empty</h3>
        <p>Add something to your cart before checking out.</p>
        <a href="/products.html" class="btn btn-primary mt-40">Browse products</a>
      </div>`;
    return;
  }

  const subtotal = items.reduce((sum, it) => sum + it.product.price * it.quantity, 0);
  const deliveryFee = subtotal >= 500 ? 0 : 30;
  const total = subtotal + deliveryFee;

  root.innerHTML = `
    <div class="cart-summary" style="position:static;margin-bottom:24px;">
      <h3 style="font-size:1.05rem;margin-bottom:14px;">${items.length} item${items.length === 1 ? '' : 's'} in your order</h3>
      ${items.map(it => `
        <div class="summary-row"><span>${escapeHtml(it.product.name)} &times; ${it.quantity}</span><span>${formatRupees(it.product.price * it.quantity)}</span></div>
      `).join('')}
      <div class="summary-row"><span>Delivery</span><span>${deliveryFee === 0 ? 'Free' : formatRupees(deliveryFee)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${formatRupees(total)}</span></div>
    </div>

    <form id="checkout-form">
      <div id="checkout-error"></div>
      <div class="field">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="3" placeholder="House / flat no., street, area, city, PIN code" required></textarea>
      </div>
      <div class="field">
        <label>Payment method</label>
        <select disabled>
          <option>Cash on Delivery (demo project &mdash; no real payment is processed)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-accent btn-block" id="place-order-btn">Place order &middot; ${formatRupees(total)}</button>
    </form>
  `;

  document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('place-order-btn');
    const errorBox = document.getElementById('checkout-error');
    errorBox.innerHTML = '';
    const address = document.getElementById('address').value.trim();
    if (!address) return;

    btn.disabled = true;
    btn.textContent = 'Placing order...';
    try {
      const order = await API.checkout(address);
      window.location.href = `/order.html?id=${order.id}&justPlaced=1`;
    } catch (err) {
      errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = `Place order \u00B7 ${formatRupees(total)}`;
    }
  });
}
</script>
</body>
</html>
