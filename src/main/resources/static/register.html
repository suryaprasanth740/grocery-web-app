<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account &mdash; FreshCart</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard">
  <div class="wrap">
    <a href="/" class="brand"><span class="crate">&#127811;</span>FreshCart</a>
    <nav class="nav-links">
      <a href="/products.html">Shop</a>
      <a href="/cart.html" class="cart-pill">&#128722; Cart <span class="count" id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="auth-card">
      <h2>Create your account</h2>
      <p class="sub">Takes less than a minute.</p>
      <div id="form-error"></div>
      <form id="register-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create account</button>
      </form>
      <div class="switch">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    FreshCart &mdash; a student full-stack demo project. Built with Spring Boot, MySQL, and vanilla JS by
    <a href="https://github.com/suryaprasanth740" target="_blank" rel="noopener">Surya Prasanth</a>.
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('register-btn');
  const errorBox = document.getElementById('form-error');
  errorBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    await API.register({
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    const next = new URLSearchParams(window.location.search).get('next') || '/index.html';
    window.location.href = next;
  } catch (err) {
    errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
