<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | NammaBasket</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="sub">Log in to pick up where you left off.</p>
      <div id="form-error"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
      </form>
      <div class="switch">New to NammaBasket? <a href="/register.html">Create an account</a></div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errorBox = document.getElementById('form-error');
  errorBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    await API.login({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    // Only go back to a page on THIS site ("/cart.html"), never to "//evil.com" (open redirect).
    const wanted = new URLSearchParams(window.location.search).get('next') || '';
    const next = /^\/(?!\/)/.test(wanted) && !wanted.includes('\\') ? wanted : '/index.html';
    window.location.href = next;
  } catch (err) {
    errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
