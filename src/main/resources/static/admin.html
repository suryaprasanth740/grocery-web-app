<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | NammaBasket</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <div class="section-heading" style="margin-top:34px;">
      <h1>Admin panel</h1>
    </div>
    <div class="tabs" role="group" aria-label="Admin sections">
      <button class="tab active" aria-pressed="true" data-tab="applications">Shop applications <span id="pending-count"></span></button>
      <button class="tab" aria-pressed="false" data-tab="shops">All shops</button>
      <button class="tab" aria-pressed="false" data-tab="accounts">Accounts</button>
      <button class="tab" aria-pressed="false" data-tab="orders">Orders</button>
      <button class="tab" aria-pressed="false" data-tab="products">Products</button>
      <button class="tab" aria-pressed="false" data-tab="reports">Buyer reports <span id="report-count"></span></button>
      <button class="tab" aria-pressed="false" data-tab="reviews">Reviews</button>
      <button class="tab" aria-pressed="false" data-tab="issues">Missing items</button>
      <button class="tab" aria-pressed="false" data-tab="categories">Categories</button>
      <button class="tab" aria-pressed="false" data-tab="coupons">Promotions</button>
      <button class="tab" aria-pressed="false" data-tab="audit">Activity log</button>
    </div>
    <div class="admin-stats" id="admin-stats"></div>
    <div id="admin-error"></div>
    <div id="admin-root"><div class="skeleton" style="height:220px;"></div></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shop.js"></script>
<script>
// Next allowed status for each status (same rules as OrderService on the server).
// Pickup orders go PREPARING -> READY_FOR_PICKUP; delivery orders go PREPARING -> OUT_FOR_DELIVERY.
const NEXT_STATUS = {
  PLACED: ['ACCEPTED', 'CANCELLED'],
  ACCEPTED: ['PREPARING', 'CANCELLED'],
  PREPARING: ['OUT_FOR_DELIVERY', 'READY_FOR_PICKUP'],
  PACKED: ['OUT_FOR_DELIVERY', 'CANCELLED'],
  OUT_FOR_DELIVERY: ['DELIVERED'],
  READY_FOR_PICKUP: ['DELIVERED'],
};
const nextStepsFor = (o) => (NEXT_STATUS[o.status] || []).filter(s =>
  !(s === 'OUT_FOR_DELIVERY' && o.fulfilment === 'PICKUP') && !(s === 'READY_FOR_PICKUP' && o.fulfilment !== 'PICKUP'));
let activeTab = 'applications';

document.addEventListener('DOMContentLoaded', async () => {
  let me;
  try { me = await API.me(); } catch (e) { window.location.href = '/login.html?next=/admin.html'; return; }
  if (me.role !== 'ADMIN') {
    document.getElementById('admin-root').innerHTML = '<div class="alert alert-error">Admins only. Log in with the admin account.</div>';
    return;
  }
  renderStats();
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => { x.classList.toggle('active', x === t); x.setAttribute('aria-pressed', String(x === t)); });
    activeTab = t.dataset.tab;
    render();
  }));
  render();
});

function showError(message) {
  document.getElementById('admin-error').innerHTML = message ? `<div class="alert alert-error">${escapeHtml(message)}</div>` : '';
}

async function render() {
  showError('');
  const root = document.getElementById('admin-root');
  try {
    if (activeTab === 'applications') await renderShops(root, 'PENDING');
    if (activeTab === 'shops') await renderShops(root, null);
    if (activeTab === 'accounts') await renderAccounts(root, 'SELLER', 0);
    if (activeTab === 'audit') await renderAudit(root);
    if (activeTab === 'reports') await renderReports(root, 'OPEN');
    if (activeTab === 'categories') await renderCategories(root);
    if (activeTab === 'orders') await renderOrders(root);
    if (activeTab === 'products') await renderProducts(root);
    if (activeTab === 'issues') await renderIssues(root);
    if (activeTab === 'reviews') await renderReviews(root);
    if (activeTab === 'coupons') await renderCoupons(root);
  } catch (e) {
    root.innerHTML = '';
    showError(e.message);
  }
}

// ---------------- Marketplace stats (real counts from the database) ----------------
async function renderStats() {
  try {
    const st = await API.adminStats();
    const pending = st.shops.PENDING || 0;
    document.getElementById('pending-count').textContent = pending ? `(${pending})` : '';
    document.getElementById('report-count').textContent = st.openReports ? `(${st.openReports})` : '';
    document.getElementById('admin-stats').innerHTML = [
      ['Buyers', Number(st.buyers).toLocaleString('en-IN')], ['Sellers', Number(st.sellers).toLocaleString('en-IN')],
      ['Live shops', st.shops.APPROVED || 0], ['Waiting for review', pending],
      ['Orders today', `${st.ordersToday} (${formatRupees(st.valueToday)})`],
      ['Last 7 days', `${st.ordersLast7Days} (${formatRupees(st.valueLast7Days)})`],
      ['Open reports', st.openReports],
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  } catch (e) { /* stats are a nice-to-have; the tabs still work */ }
}

// ---------------- Shops and applications ----------------
const SHOP_STATUS_TEXT = { PENDING: 'Waiting', APPROVED: 'Approved', REJECTED: 'Rejected', SUSPENDED: 'Suspended' };
// Which actions make sense for each status (same rules as ShopService on the server)
const SHOP_ACTIONS = {
  PENDING: [['approve', 'Approve', false], ['reject', 'Reject', true]],
  APPROVED: [['suspend', 'Suspend', true]],
  SUSPENDED: [['reactivate', 'Reactivate', false]],
  REJECTED: [],
};

async function renderShops(root, status) {
  const shops = await API.adminShops(status);
  if (!shops.length) {
    root.innerHTML = `<div class="empty-state"><h3>${status === 'PENDING' ? 'No applications waiting' : 'No shops yet'}</h3>
      <p>${status === 'PENDING' ? 'New seller applications will appear here.' : 'Shops appear here when sellers apply.'}</p></div>`;
    return;
  }
  root.innerHTML = `<div class="table-wrap"><table class="admin-table">
    <thead><tr><th>Shop</th><th>Owner</th><th>Area</th><th>Hours &amp; fees</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${shops.map(s => `
      <tr>
        <td><b>${escapeHtml(s.name)}</b><div class="muted small">${escapeHtml(s.categoryLabel)}</div>
            <div class="muted small">Applied ${formatDateTime(s.createdAt)}</div></td>
        <td>${escapeHtml(s.ownerName)}<div class="muted small">${escapeHtml(s.ownerEmail)}</div><div class="muted small">${escapeHtml(s.phone)}</div></td>
        <td class="small">${escapeHtml(s.addressLine)}<div class="muted">Delivers to ${escapeHtml(s.servicePincodes.join(', '))}</div></td>
        <td class="small">${s.openTime}&ndash;${s.closeTime}<div class="muted">${[s.offersDelivery && 'Delivery', s.offersPickup && 'Pickup'].filter(Boolean).join(', ')}</div>
            <div class="muted">Fee ${formatRupees(s.deliveryFee)}, min ${formatRupees(s.minOrderAmount)}</div></td>
        <td><span class="status-pill ${s.status}" style="margin:0;">${SHOP_STATUS_TEXT[s.status]}</span>
            ${s.statusReason ? `<div class="muted small" style="margin-top:4px;">${escapeHtml(s.statusReason)}</div>` : ''}</td>
        <td class="actions">${SHOP_ACTIONS[s.status].map(([action, label, needsReason]) => `
          <button class="btn btn-sm ${needsReason ? 'btn-outline danger' : 'btn-primary'}" data-shop="${s.id}" data-action="${action}" data-reason="${needsReason}">${label}</button>`).join('') || '<span class="muted small">&mdash;</span>'}
          <div class="reason-form" hidden>
            <textarea rows="2" maxlength="300" placeholder="Reason the owner will see"></textarea>
            <button class="btn btn-sm btn-primary confirm" type="button">Confirm</button>
          </div>
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  root.querySelectorAll('button[data-shop]').forEach(btn => btn.addEventListener('click', async () => {
    const cell = btn.closest('td');
    const run = async (reason) => {
      btn.disabled = true;
      try {
        await API.adminShopAction(Number(btn.dataset.shop), btn.dataset.action, reason);
        showToast('Shop ' + ({ approve: 'approved', reject: 'rejected', suspend: 'suspended', reactivate: 'reactivated' })[btn.dataset.action], 'ok');
        await Promise.all([renderShops(root, status), renderStats()]);
      } catch (e) { showError(e.message); btn.disabled = false; }
    };
    if (btn.dataset.reason !== 'true') { run(); return; }
    const form = cell.querySelector('.reason-form');
    form.hidden = false;
    const box = form.querySelector('textarea');
    box.focus();
    form.querySelector('.confirm').onclick = () => {
      if (box.value.trim().length < 5) { showError('Write a reason of at least 5 characters. The shop owner will see it.'); return; }
      run(box.value.trim());
    };
  }));
}

// ---------------- Accounts ----------------
async function renderAccounts(root, role, page) {
  const data = await API.adminUsers(role, page);
  const rows = data.items;
  root.innerHTML = `
    <div class="chip-row" style="margin-bottom:12px;">
      <button class="chip ${role === 'SELLER' ? 'active' : ''}" data-role="SELLER">Sellers</button>
      <button class="chip ${role === 'BUYER' ? 'active' : ''}" data-role="BUYER">Buyers</button>
      <span class="muted small" style="align-self:center;">${data.totalItems} account${data.totalItems === 1 ? '' : 's'}</span>
    </div>
    ${rows.length ? `<div class="table-wrap"><table class="admin-table">
      <thead><tr><th>Name</th><th>Email</th><th>Joined</th>${role === 'SELLER' ? '<th>Shop</th>' : ''}<th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows.map(u => `
        <tr>
          <td><b>${escapeHtml(u.name)}</b>${u.phone ? `<div class="muted small">${escapeHtml(u.phone)}</div>` : ''}</td>
          <td>${escapeHtml(u.email)}</td>
          <td class="small">${formatDateTime(u.createdAt)}</td>
          ${role === 'SELLER' ? `<td>${u.shopName ? `${escapeHtml(u.shopName)}<div class="muted small">${SHOP_STATUS_TEXT[u.shopStatus] || ''}</div>` : '&mdash;'}</td>` : ''}
          <td>${u.accountStatus === 'SUSPENDED' ? '<span class="status-pill SUSPENDED" style="margin:0;">Suspended</span>' : 'Active'}</td>
          <td class="actions">${u.accountStatus === 'SUSPENDED'
            ? `<button class="btn btn-sm btn-primary" data-user="${u.id}" data-action="reactivate">Reactivate</button>`
            : `<button class="btn btn-sm btn-outline danger" data-user="${u.id}" data-action="suspend">Suspend</button>`}
            <div class="reason-form" hidden>
              <textarea rows="2" maxlength="300" placeholder="Reason (kept in the activity log)"></textarea>
              <button class="btn btn-sm btn-primary confirm" type="button">Confirm</button>
            </div>
          </td>
        </tr>`).join('')}</tbody></table></div>` : '<div class="empty-state"><h3>No accounts yet</h3></div>'}
    ${data.totalPages > 1 ? `<div class="action-row">
      <button class="btn btn-outline btn-sm" data-page="${page - 1}" ${page <= 0 ? 'disabled' : ''}>Previous</button>
      <span class="muted small" style="align-self:center;">Page ${page + 1} of ${data.totalPages}</span>
      <button class="btn btn-outline btn-sm" data-page="${page + 1}" ${page + 1 >= data.totalPages ? 'disabled' : ''}>Next</button></div>` : ''}`;

  root.querySelectorAll('button[data-role]').forEach(b => b.addEventListener('click', () => renderAccounts(root, b.dataset.role, 0)));
  root.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => renderAccounts(root, role, Number(b.dataset.page))));
  root.querySelectorAll('button[data-user]').forEach(btn => btn.addEventListener('click', async () => {
    const run = async (reason) => {
      btn.disabled = true;
      try {
        await API.adminUserAction(Number(btn.dataset.user), btn.dataset.action, reason);
        showToast(btn.dataset.action === 'suspend' ? 'Account suspended' : 'Account reactivated', 'ok');
        await renderAccounts(root, role, page);
      } catch (e) { showError(e.message); btn.disabled = false; }
    };
    if (btn.dataset.action === 'reactivate') { run(); return; }
    const form = btn.closest('td').querySelector('.reason-form');
    form.hidden = false;
    const box = form.querySelector('textarea');
    box.focus();
    form.querySelector('.confirm').onclick = () => {
      if (box.value.trim().length < 5) { showError('Write a reason of at least 5 characters.'); return; }
      run(box.value.trim());
    };
  }));
}

// ---------------- Activity log ----------------
async function renderAudit(root) {
  const rows = await API.adminAudit();
  if (!rows.length) { root.innerHTML = '<div class="empty-state"><h3>Nothing logged yet</h3><p>Approvals, suspensions and order changes are recorded here.</p></div>'; return; }
  root.innerHTML = `<div class="table-wrap"><table class="admin-table">
    <thead><tr><th>When</th><th>Who</th><th>What</th><th>Target</th><th>Details</th></tr></thead>
    <tbody>${rows.map(a => `
      <tr><td class="small">${formatDateTime(a.createdAt)}</td><td class="small">${escapeHtml(a.actorEmail)}</td>
        <td><b>${escapeHtml(a.action.replaceAll('_', ' ').toLowerCase())}</b></td>
        <td class="small">${escapeHtml(a.targetType.toLowerCase())} #${a.targetId ?? ''}</td>
        <td class="small">${escapeHtml(a.details || '')}</td></tr>`).join('')}</tbody></table></div>`;
}

// ---------------- Orders ----------------
let orderFilters = { status: '', shopId: '', page: 0 };
async function renderOrders(root) {
  const [data, shops] = await Promise.all([API.adminOrderSearch(orderFilters), API.adminShops(null)]);
  const orders = data.items;
  const statusOptions = ['', 'PAYMENT_PENDING', 'PLACED', 'ACCEPTED', 'PREPARING', 'READY_FOR_PICKUP', 'OUT_FOR_DELIVERY', 'DELIVERED', 'CANCELLED', 'PAYMENT_FAILED'];
  const filterBar = `<div class="filter-bar">
      <label class="filter-sort" style="margin-left:0;">Shop <select id="of-shop"><option value="">All shops</option>${shops.map(s => `<option value="${s.id}" ${String(s.id) === String(orderFilters.shopId) ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}</select></label>
      <label class="filter-sort" style="margin-left:0;">Status <select id="of-status">${statusOptions.map(v => `<option value="${v}" ${v === orderFilters.status ? 'selected' : ''}>${v ? escapeHtml(STATUS_LABELS[v][0]) : 'Any status'}</option>`).join('')}</select></label>
      <span class="muted small">${data.totalItems} order${data.totalItems === 1 ? '' : 's'}</span>
    </div>`;
  const pager = data.totalPages > 1 ? `<div class="action-row">
      <button class="btn btn-outline btn-sm" data-opage="${orderFilters.page - 1}" ${orderFilters.page <= 0 ? 'disabled' : ''}>Previous</button>
      <span class="muted small" style="align-self:center;">Page ${orderFilters.page + 1} of ${data.totalPages}</span>
      <button class="btn btn-outline btn-sm" data-opage="${orderFilters.page + 1}" ${orderFilters.page + 1 >= data.totalPages ? 'disabled' : ''}>Next</button></div>` : '';
  const wireFilters = () => {
    root.querySelector('#of-shop').addEventListener('change', (e) => { orderFilters.shopId = e.target.value; orderFilters.page = 0; renderOrders(root); });
    root.querySelector('#of-status').addEventListener('change', (e) => { orderFilters.status = e.target.value; orderFilters.page = 0; renderOrders(root); });
    root.querySelectorAll('[data-opage]').forEach(b => b.addEventListener('click', () => { orderFilters.page = Number(b.dataset.opage); renderOrders(root); }));
  };
  if (!orders.length) { root.innerHTML = filterBar + '<div class="empty-state"><h3>No orders match</h3></div>'; wireFilters(); return; }
  root.innerHTML = filterBar + `<div class="table-wrap"><table class="admin-table">
    <thead><tr><th>#</th><th>Date</th><th>Shop</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>If unavailable</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${orders.map(o => `
      <tr>
        <td><b>${o.id}</b></td>
        <td>${formatDateTime(o.createdAt)}</td>
        <td>${escapeHtml(o.shopName || '-')}<div class="muted small">${o.fulfilment === 'PICKUP' ? 'Pickup' : 'Delivery'}</div></td>
        <td>${escapeHtml(o.customerName || '')}<div class="muted small">${escapeHtml(o.customerEmail || '')}</div><div class="muted small">PIN ${escapeHtml(o.pincode || '-')}</div></td>
        <td>${o.items.map(i => `${escapeHtml(i.productName)} &times; ${i.quantity}`).join('<br>')}</td>
        <td>${formatRupees(o.totalAmount)}${Number(o.discount) > 0 ? `<div class="muted small">${escapeHtml(o.couponCode)} &minus;${formatRupees(o.discount)}</div>` : ''}</td>
        <td>${escapeHtml(o.paymentMethod)}<div class="muted small">${escapeHtml(PAYMENT_LABELS[o.paymentStatus] || o.paymentStatus)}</div></td>
        <td class="small">${escapeHtml(SUBSTITUTION_LABELS[o.substitutionPreference] || '-')}</td>
        <td>${statusBadgeHtml(o.status)}${o.slotDate ? `<div class="muted small">Slot ${escapeHtml(slotText(o))}</div>` : ''}${o.status === 'DELIVERED' ? `<div><a class="small" style="text-decoration:underline;" href="/invoice.html?id=${o.id}&as=admin">Invoice</a></div>` : ''}</td>
        <td class="actions">${nextStepsFor(o).map(s => `
          <button class="btn btn-sm ${s === 'CANCELLED' ? 'btn-outline danger' : 'btn-primary'}" data-order="${o.id}" data-status="${s}">
            ${s === 'CANCELLED' ? 'Cancel' : 'Mark ' + escapeHtml(STATUS_LABELS[s][0].toLowerCase())}</button>`).join('') || '<span class="muted small">&mdash;</span>'}
        </td>
      </tr>`).join('')}</tbody></table></div>` + pager;
  wireFilters();
  root.querySelectorAll('button[data-order]').forEach(btn => btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await API.adminSetStatus(Number(btn.dataset.order), btn.dataset.status);
      showToast('Order updated');
      await renderOrders(root);
    } catch (e) { showError(e.message); btn.disabled = false; }
  }));
}

// ---------------- Products ----------------
async function renderProducts(root) {
  const [products, categories] = await Promise.all([API.adminProducts(), API.categories()]);
  const catOptions = (selected) => categories.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
  const gstOptions = (selected) => [0, 5, 12, 18].map(g => `<option value="${g}" ${g === selected ? 'selected' : ''}>${g}%</option>`).join('');
  const mineShop = (products.find(p => p.shopSlug === 'nammabasket-demo-kirana') || {}).shopId;
  const sellerRow = (p) => `
    <tr>
      <td>${escapeHtml(p.imageEmoji || '')}</td>
      <td><b>${escapeHtml(p.name)}</b><div class="muted small">${escapeHtml(p.unit || '')}</div></td>
      <td colspan="5" class="small">${escapeHtml(p.shopName || '-')}, ${formatRupees(p.price)}, stock ${p.stock}
        <div class="muted">Seller's product: only the seller can edit it.</div></td>
      <td><button class="btn btn-sm ${p.active ? 'btn-outline danger' : 'btn-primary'}" data-moderate="${p.id}" data-active="${!p.active}">${p.active ? 'Hide' : 'Show'}</button>
        <div class="reason-form" hidden><textarea rows="2" maxlength="300" placeholder="Why hide it? (kept in the activity log)"></textarea>
        <button class="btn btn-sm btn-primary confirm" type="button">Confirm</button></div></td>
    </tr>`;
  const row = (p) => p && p.shopId !== mineShop ? sellerRow(p) : `
    <tr data-id="${p ? p.id : ''}">
      <td><input class="f-emoji" value="${p ? escapeHtml(p.imageEmoji || '') : ''}" maxlength="10" style="width:52px"></td>
      <td><input class="f-name" value="${p ? escapeHtml(p.name) : ''}" maxlength="150" placeholder="Name">
          <input class="f-unit" value="${p ? escapeHtml(p.unit || '') : ''}" maxlength="20" placeholder="Unit, e.g. 1 kg"></td>
      <td><select class="f-cat">${catOptions(p && p.category ? p.category.id : null)}</select></td>
      <td><input class="f-price" type="number" min="1" step="0.01" value="${p ? p.price : ''}" style="width:90px"></td>
      <td><input class="f-stock" type="number" min="0" max="10000" value="${p ? p.stock : 0}" style="width:80px"></td>
      <td><input class="f-expiry" type="date" value="${p && p.expiryDate ? p.expiryDate : ''}">
          ${p ? expiryTagHtml(p) : ''}</td>
      <td><select class="f-gst">${gstOptions(p ? p.gstPercent : 0)}</select></td>
      <td><button class="btn btn-sm btn-primary f-save">${p ? 'Save' : 'Add'}</button></td>
    </tr>`;
  root.innerHTML = `
    <p class="bill-note">You can edit the NammaBasket Demo Kirana's products here. Sellers' products can only be hidden or shown.
      Change a demo price to test the "price changed" warning in a buyer's cart; set an old expiry date to test expiry blocking.</p>
    <div class="table-wrap"><table class="admin-table">
      <thead><tr><th>Icon</th><th>Name / unit</th><th>Category</th><th>Price &#8377;</th><th>Stock</th><th>Best before</th><th>GST</th><th></th></tr></thead>
      <tbody>${row(null)}${products.map(row).join('')}</tbody>
    </table></div>`;
  root.querySelectorAll('button[data-moderate]').forEach(btn => btn.addEventListener('click', async () => {
    const show = btn.dataset.active === 'true';
    const send = async (reason) => {
      btn.disabled = true;
      try {
        await API.adminSetProductActive(Number(btn.dataset.moderate), show, reason);
        showToast(show ? 'Product shown again' : 'Product hidden from buyers', 'ok');
        await renderProducts(root);
      } catch (e) { showError(e.message); btn.disabled = false; }
    };
    if (show) { send(null); return; }
    const form = btn.closest('td').querySelector('.reason-form');
    form.hidden = false;
    form.querySelector('textarea').focus();
    form.querySelector('.confirm').onclick = () => send(form.querySelector('textarea').value.trim());
  }));
  root.querySelectorAll('.f-save').forEach(btn => btn.addEventListener('click', async () => {
    const tr = btn.closest('tr');
    const val = (cls) => tr.querySelector(cls).value;
    const payload = {
      name: val('.f-name'), unit: val('.f-unit'), imageEmoji: val('.f-emoji'),
      categoryId: Number(val('.f-cat')), price: val('.f-price') === '' ? null : Number(val('.f-price')),
      stock: val('.f-stock') === '' ? null : Number(val('.f-stock')),
      expiryDate: val('.f-expiry') || null, gstPercent: Number(val('.f-gst')),
    };
    const id = tr.dataset.id;
    if (id) {
      const existing = products.find(p => String(p.id) === id);
      payload.description = existing.description;
    }
    btn.disabled = true;
    try {
      if (id) await API.adminUpdateProduct(Number(id), payload); else await API.adminCreateProduct(payload);
      showToast(id ? 'Product saved' : 'Product added');
      await renderProducts(root);
    } catch (e) { showError(e.message); btn.disabled = false; }
  }));
}

// ---------------- Reported problems ----------------
async function renderIssues(root) {
  const issues = await API.adminIssues();
  if (!issues.length) { root.innerHTML = '<p>No problems reported. &#127881;</p>'; return; }
  root.innerHTML = `<div class="table-wrap"><table class="admin-table">
    <thead><tr><th>Date</th><th>Order</th><th>Shop / buyer</th><th>Item</th><th>Qty</th><th>Problem</th><th>Note</th><th>Refund</th></tr></thead>
    <tbody>${issues.map(i => `<tr>
      <td>${formatDateTime(i.createdAt)}</td><td>#${i.orderId}</td>
      <td class="small">${escapeHtml(i.shopName || '-')}<div class="muted">${escapeHtml(i.customerEmail || '')}</div></td><td>${escapeHtml(i.productName)}</td><td>${i.quantity}</td>
      <td>${escapeHtml(i.reason)}</td><td class="small">${escapeHtml(i.note || '')}</td><td>${formatRupees(i.refundAmount)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

// ---------------- Coupons ----------------
async function renderCoupons(root) {
  const coupons = await API.adminCoupons();
  const now = Date.now();
  root.innerHTML = `
    <form class="panel" id="coupon-form" novalidate style="margin-bottom:18px;">
      <h2 id="cf-title">New promotion</h2>
      <p class="panel-sub">Platform coupons apply to the whole basket and are paid for by NammaBasket, not the shops.</p>
      <div id="cf-msg" aria-live="polite"></div>
      <input type="hidden" name="id">
      <div class="form-3">
        <div class="field"><label for="cf-code">Code</label><input id="cf-code" name="code" maxlength="20" placeholder="DIWALI100"></div>
        <div class="field"><label for="cf-type">Type</label><select id="cf-type" name="type"><option value="FLAT">Rupees off</option><option value="PERCENT">Percent off</option></select></div>
        <div class="field"><label for="cf-value">Discount</label><input id="cf-value" name="value" type="number" min="1" max="1000"></div>
      </div>
      <div class="field"><label for="cf-desc">Offer text buyers see</label><input id="cf-desc" name="description" maxlength="150" placeholder="Rs 100 off on orders above Rs 999"></div>
      <div class="form-3">
        <div class="field"><label for="cf-max">Max discount (&#8377;, percent only)</label><input id="cf-max" name="maxDiscount" type="number" min="1" max="1000"></div>
        <div class="field"><label for="cf-min">Minimum order (&#8377;)</label><input id="cf-min" name="minOrder" type="number" min="0" value="0"></div>
        <div class="field"><label for="cf-uses">Uses per buyer</label><input id="cf-uses" name="perUserLimit" type="number" min="1" max="50" value="1"></div>
      </div>
      <div class="form-2">
        <div class="field"><label for="cf-last">Last day</label><input id="cf-last" name="lastDay" type="date"></div>
      </div>
      <div class="action-row" style="margin:0;">
        <button class="btn btn-primary" type="submit" id="cf-save">Create promotion</button>
        <button class="btn btn-outline" type="button" id="cf-reset">Clear</button>
      </div>
    </form>
    <div class="table-wrap"><table class="admin-table">
    <thead><tr><th>Code</th><th>Offer</th><th>Min order</th><th>Per buyer</th><th>Last day</th><th>Active</th><th></th></tr></thead>
    <tbody>${coupons.map(c => {
      const expired = c.expiresAt && serverDate(c.expiresAt).getTime() <= now;
      return `<tr>
        <td><b>${escapeHtml(c.code)}</b></td><td>${escapeHtml(c.description)}</td><td>${formatRupees(c.minOrder)}</td>
        <td>${c.perUserLimit}</td>
        <td>${c.expiresAt ? formatDateTime(c.expiresAt) : 'Never'} ${expired ? '<span class="expiry-tag danger">expired</span>' : ''}</td>
        <td><label class="toggle"><input type="checkbox" data-coupon="${c.id}" ${c.active ? 'checked' : ''}><span></span><span class="sr-only">${escapeHtml(c.code)} active</span></label></td>
        <td><button class="btn btn-outline btn-sm" data-edit-coupon="${c.id}">Edit</button></td>
      </tr>`; }).join('')}</tbody></table></div>`;
  const form = root.querySelector('#coupon-form');
  const fill = (c) => {
    form.elements.id.value = c ? c.id : '';
    form.elements.code.value = c ? c.code : '';
    form.elements.code.disabled = !!c;
    form.elements.type.value = c ? c.type : 'FLAT';
    form.elements.value.value = c ? c.value : '';
    form.elements.description.value = c ? c.description : '';
    form.elements.maxDiscount.value = c && c.maxDiscount != null ? c.maxDiscount : '';
    form.elements.minOrder.value = c ? c.minOrder : 0;
    form.elements.perUserLimit.value = c ? c.perUserLimit : 1;
    form.elements.lastDay.value = c && c.expiresAt ? serverDate(c.expiresAt).toLocaleDateString('en-CA') : '';
    root.querySelector('#cf-title').textContent = c ? `Edit ${c.code}` : 'New promotion';
    root.querySelector('#cf-save').textContent = c ? 'Save changes' : 'Create promotion';
  };
  root.querySelector('#cf-reset').addEventListener('click', () => fill(null));
  root.querySelectorAll('[data-edit-coupon]').forEach(b => b.addEventListener('click', () => {
    fill(coupons.find(c => c.id === Number(b.dataset.editCoupon)));
    form.scrollIntoView({ behavior: 'smooth' });
  }));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const el = form.elements;
    const num = (v) => v === '' ? null : Number(v);
    const payload = {
      code: el.code.value.trim(), type: el.type.value, value: num(el.value.value), description: el.description.value.trim(),
      maxDiscount: el.type.value === 'PERCENT' ? num(el.maxDiscount.value) : null, minOrder: num(el.minOrder.value),
      perUserLimit: num(el.perUserLimit.value), lastDay: el.lastDay.value || null,
    };
    const btn = root.querySelector('#cf-save');
    btn.disabled = true;
    try {
      if (el.id.value) await API.adminUpdateCoupon(Number(el.id.value), payload); else await API.adminCreateCoupon(payload);
      showToast(el.id.value ? 'Promotion saved' : 'Promotion created', 'ok');
      await renderCoupons(root);
    } catch (err) {
      root.querySelector('#cf-msg').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
    }
  });
  root.querySelectorAll('input[data-coupon]').forEach(cb => cb.addEventListener('change', async () => {
    try { await API.adminSetCouponActive(Number(cb.dataset.coupon), cb.checked); await renderCoupons(root); }
    catch (e) { showError(e.message); }
  }));
}

// ---------------- Buyer reports ----------------
async function renderReports(root, status) {
  const reports = await API.adminReports(status);
  const filters = [['OPEN', 'Open'], ['RESOLVED', 'Resolved'], ['DISMISSED', 'Dismissed'], ['ALL', 'All']];
  root.innerHTML = `
    <div class="chip-row" style="margin-bottom:14px;">${filters.map(([v, l]) => `<button class="chip ${v === status ? 'active' : ''}" data-rfilter="${v}">${l}</button>`).join('')}</div>
    ${reports.length ? reports.map(r => `
      <article class="order-card">
        <div class="top-row">
          <div><div class="order-id">${r.targetType === 'PRODUCT' ? `${escapeHtml(r.productName)} <span class="muted small">from ${escapeHtml(r.shopName)}</span>` : escapeHtml(r.shopName)}</div>
            <div class="date">Report #${r.id}, ${formatDateTime(r.createdAt)}, by ${escapeHtml(r.reporterEmail)}</div></div>
          <span class="status-pill ${r.status === 'OPEN' ? 'PENDING' : r.status === 'RESOLVED' ? 'APPROVED' : 'SUSPENDED'}" style="margin:0;">${r.status.toLowerCase()}</span>
        </div>
        <div class="order-meta">
          <div><strong>Reason:</strong> ${escapeHtml(r.reasonLabel)}</div>
          ${r.details ? `<div><strong>Buyer wrote:</strong> ${escapeHtml(r.details)}</div>` : ''}
          <div><strong>Shop is:</strong> ${escapeHtml(r.shopStatus.toLowerCase())}${r.targetType === 'PRODUCT' ? `; product is ${r.productActive ? 'on sale' : 'hidden'}` : ''}</div>
          ${r.resolutionNote ? `<div><strong>Outcome:</strong> ${escapeHtml(r.resolutionNote)} <span class="muted">(${escapeHtml(r.resolvedBy || '')})</span></div>` : ''}
        </div>
        ${r.status === 'OPEN' ? `<form class="resolve-form" data-report="${r.id}">
          <div class="form-3">
            <div class="field"><label>Outcome</label><select name="status"><option value="RESOLVED">Resolved: problem confirmed</option><option value="DISMISSED">Dismissed: nothing wrong</option></select></div>
            <div class="field"><label>Action</label><select name="action"><option value="NONE">No action</option>
              ${r.targetType === 'PRODUCT' ? '<option value="HIDE_PRODUCT">Hide the product</option>' : ''}
              ${r.shopStatus === 'APPROVED' ? '<option value="SUSPEND_SHOP">Suspend the shop</option>' : ''}</select></div>
            <div class="field"><label>What you found</label><input name="note" maxlength="300" placeholder="Checked with the shop..."></div>
          </div>
          <button class="btn btn-primary btn-sm" type="submit">Close report</button>
        </form>` : ''}
      </article>`).join('') : `<div class="empty-state"><h3>No ${status === 'ALL' ? '' : status.toLowerCase() + ' '}reports</h3><p>Reports from buyers about shops and products appear here.</p></div>`}`;
  root.querySelectorAll('[data-rfilter]').forEach(b => b.addEventListener('click', () => renderReports(root, b.dataset.rfilter)));
  root.querySelectorAll('.resolve-form').forEach(f => f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = f.querySelector('button');
    btn.disabled = true;
    try {
      await API.adminResolveReport(Number(f.dataset.report), { status: f.elements.status.value, action: f.elements.action.value, note: f.elements.note.value.trim() });
      showToast('Report closed', 'ok');
      await Promise.all([renderReports(root, status), renderStats()]);
    } catch (err) { showError(err.message); btn.disabled = false; }
  }));
}

// ---------------- Reviews (moderation) ----------------
async function renderReviews(root) {
  const reviews = await API.adminReviews();
  if (!reviews.length) {
    root.innerHTML = '<div class="empty-state"><h3>No reviews yet</h3><p>Buyers can review products after an order is delivered.</p></div>';
    return;
  }
  root.innerHTML = `<p class="muted small">Latest 100 reviews. Hiding one removes it from the product and shop averages; the buyer sees it was hidden.</p>
    <div class="table-wrap"><table class="admin-table">
    <thead><tr><th>Product</th><th>Stars</th><th>Comment</th><th>By</th><th>Date</th><th>Visible</th><th>Action</th></tr></thead>
    <tbody>${reviews.map(r => `<tr>
      <td>${escapeHtml(r.productName)}<div class="muted small">${escapeHtml(r.shopName)}</div></td>
      <td>${r.rating}/5</td>
      <td style="max-width:320px;">${r.comment ? escapeHtml(r.comment) : '<span class="muted">&mdash;</span>'}</td>
      <td>${escapeHtml(r.buyerName)}</td>
      <td class="small">${formatDateTime(r.createdAt)}</td>
      <td>${r.hidden ? `<span class="status-pill SUSPENDED" style="margin:0;">hidden</span><div class="muted small">${escapeHtml(r.hiddenReason || '')}</div>` : 'Yes'}</td>
      <td class="actions">${r.hidden
        ? `<button class="btn btn-sm btn-outline" data-show-review="${r.id}">Show again</button>`
        : `<form class="inline-row" data-hide-review="${r.id}"><input name="reason" maxlength="300" required placeholder="Reason" aria-label="Reason for hiding" style="min-width:120px;">
            <button class="btn btn-sm btn-outline danger" type="submit">Hide</button></form>`}</td>
    </tr>`).join('')}</tbody></table></div>`;
  root.querySelectorAll('[data-show-review]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try { await API.adminShowReview(Number(b.dataset.showReview)); showToast('Review visible again', 'ok'); await renderReviews(root); }
    catch (e) { showError(e.message); b.disabled = false; }
  }));
  root.querySelectorAll('[data-hide-review]').forEach(f => f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const reason = f.elements.reason.value.trim();
    if (!reason) { showError('Give a reason for hiding the review.'); return; }
    try { await API.adminHideReview(Number(f.dataset.hideReview), reason); showToast('Review hidden', 'ok'); await renderReviews(root); }
    catch (err) { showError(err.message); }
  }));
}

// ---------------- Categories ----------------
async function renderCategories(root) {
  const categories = await API.categories();
  root.innerHTML = `
    <form class="panel" id="cat-form" style="margin-bottom:18px;" novalidate>
      <h2>Add a category</h2>
      <div class="inline-row">
        <input name="icon" maxlength="10" placeholder="Emoji" style="max-width:90px;" aria-label="Icon (emoji)">
        <input name="name" maxlength="60" placeholder="e.g. Personal care" aria-label="Category name">
        <button class="btn btn-primary" type="submit">Add</button>
      </div>
    </form>
    <div class="table-wrap"><table class="admin-table">
      <thead><tr><th>Icon</th><th>Name</th><th></th></tr></thead>
      <tbody>${categories.map(c => `<tr data-cat="${c.id}">
        <td><input class="c-icon" value="${escapeHtml(c.icon || '')}" maxlength="10" style="width:64px" aria-label="Icon"></td>
        <td><input class="c-name" value="${escapeHtml(c.name)}" maxlength="60" aria-label="Name"></td>
        <td class="actions" style="flex-direction:row;"><button class="btn btn-sm btn-primary c-save">Save</button>
          <button class="btn btn-sm btn-outline danger c-del">Delete</button></td>
      </tr>`).join('')}</tbody></table></div>
    <p class="bill-note">A category can only be deleted when no product uses it.</p>`;
  root.querySelector('#cat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await API.adminCreateCategory({ name: e.target.elements.name.value.trim(), icon: e.target.elements.icon.value.trim() });
      showToast('Category added', 'ok');
      await renderCategories(root);
    } catch (err) { showError(err.message); }
  });
  root.querySelectorAll('tr[data-cat]').forEach(tr => {
    const id = Number(tr.dataset.cat);
    tr.querySelector('.c-save').addEventListener('click', async () => {
      try { await API.adminUpdateCategory(id, { name: tr.querySelector('.c-name').value.trim(), icon: tr.querySelector('.c-icon').value.trim() }); showToast('Category saved', 'ok'); }
      catch (err) { showError(err.message); }
    });
    tr.querySelector('.c-del').addEventListener('click', async () => {
      try { await API.adminDeleteCategory(id); showToast('Category deleted', 'ok'); await renderCategories(root); }
      catch (err) { showError(err.message); }
    });
  });
}

</script>
