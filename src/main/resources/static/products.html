<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | NammaBasket</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <div class="section-heading" style="margin-top:34px;">
      <h1 id="page-title">Full catalog</h1>
      <span class="note" id="result-count"></span>
    </div>

    <div class="search-row" style="max-width:100%;margin-bottom:8px;">
      <input type="text" id="search-input" placeholder="Search products...">
      <button class="btn btn-primary" id="search-btn">Search</button>
    </div>

    <div class="category-row" id="category-row"></div>

    <div class="filter-bar" role="group" aria-label="Filters">
      <label class="filter-check"><input type="checkbox" id="f-stock"> In stock only</label>
      <label class="filter-check" id="f-pin-wrap"><input type="checkbox" id="f-pin"> <span id="f-pin-label">Delivers to my PIN code</span></label>
      <label class="filter-sort">Sort
        <select id="f-sort">
          <option value="">Recommended</option>
          <option value="price">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="discount">Biggest discount</option>
        </select>
      </label>
    </div>
    <div id="shop-results"></div>

    <div class="grid" id="product-grid">
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shop.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
let activeCategoryId = urlParams.get('categoryId') ? Number(urlParams.get('categoryId')) : null;
let activeSearch = urlParams.get('search') || '';

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('search-input').value = activeSearch;
  document.getElementById('search-btn').addEventListener('click', runSearch);
  document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runSearch();
  });

  function runSearch() {
    activeSearch = document.getElementById('search-input').value.trim();
    activeCategoryId = null;
    loadProducts();
    renderCategories();
  }

  try {
    const categories = await API.categories();
    window.__categories = categories;
    renderCategories();
  } catch (e) {
    document.getElementById('category-row').innerHTML = '';
  }

  const loc = NBLocation.get();
  const pinBox = document.getElementById('f-pin');
  if (loc && loc.pincode) {
    document.getElementById('f-pin-label').textContent = `Delivers to ${loc.pincode}`;
  } else {
    pinBox.disabled = true;
    document.getElementById('f-pin-wrap').title = 'Set your PIN code at the top of the page first';
  }
  ['f-stock', 'f-pin', 'f-sort'].forEach(id => document.getElementById(id).addEventListener('change', loadProducts));
  document.addEventListener('nb:location', (e) => {
    pinBox.disabled = false;
    document.getElementById('f-pin-label').textContent = `Delivers to ${e.detail.pincode}`;
    if (pinBox.checked) loadProducts();
  });

  loadProducts();
});

function renderCategories() {
  const categories = window.__categories || [];
  const row = document.getElementById('category-row');
  const allChip = `<button class="category-chip ${!activeCategoryId ? 'active' : ''}" data-cat=""><span class="emoji">&#128722;</span><span>All</span></button>`;
  const chips = categories.map(c => `
    <button class="category-chip ${activeCategoryId === c.id ? 'active' : ''}" data-cat="${c.id}">
      <span class="emoji">${c.icon || '\u{1F6D2}'}</span><span>${escapeHtml(c.name)}</span>
    </button>
  `).join('');
  row.innerHTML = allChip + chips;
  row.querySelectorAll('.category-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cat = chip.dataset.cat;
      activeCategoryId = cat ? Number(cat) : null;
      activeSearch = '';
      document.getElementById('search-input').value = '';
      loadProducts();
      renderCategories();
    });
  });
}

/** When searching, shops whose name matches are shown above the products. */
async function renderShopResults() {
  const box = document.getElementById('shop-results');
  if (!activeSearch) { box.innerHTML = ''; return; }
  try {
    const shops = await API.shops({ q: activeSearch });
    box.innerHTML = shops.length ? `<h3 style="font-size:1.05rem;margin:6px 0 10px;">Shops</h3>
      <div class="shop-strip">${shops.map(shopCardHtml).join('')}</div>` : '';
  } catch (e) { box.innerHTML = ''; }
}

async function loadProducts() {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '<div class="skeleton" style="height:220px;"></div><div class="skeleton" style="height:220px;"></div>';

  const params = {};
  if (activeSearch) params.search = activeSearch;
  else if (activeCategoryId) params.categoryId = activeCategoryId;
  const loc = NBLocation.get();
  if (document.getElementById('f-pin').checked && loc && loc.pincode) params.pincode = loc.pincode;

  document.getElementById('page-title').textContent = activeSearch
    ? `Results for "${activeSearch}"`
    : (activeCategoryId && window.__categories
        ? (window.__categories.find(c => c.id === activeCategoryId)?.name || 'Shop')
        : 'Full catalog');

  try {
    let products = await API.products(params);
    if (document.getElementById('f-stock').checked) products = products.filter(p => p.stock > 0 && !p.expired);
    const sort = document.getElementById('f-sort').value;
    if (sort === 'price') products.sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
    if (sort === 'discount') products.sort((a, b) => (b.discountPercent || 0) - (a.discountPercent || 0));
    renderShopResults();
    document.getElementById('result-count').textContent = `${products.length} item${products.length === 1 ? '' : 's'}`;
    if (products.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <div class="big-emoji">&#128269;</div>
        <h3>No products found</h3>
        <p>Try a different search term or category.</p>
      </div>`;
      return;
    }
    grid.innerHTML = products.map(productCardHtml).join('');
    attachAddToCartHandlers(grid);
  } catch (e) {
    grid.innerHTML = '<p>Could not load products right now.</p>';
  }
}

// productCardHtml() and attachAddToCartHandlers() live in /js/shop.js
</script>
</body>
</html>
