<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | NammaBasket</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <div class="section-heading" style="margin-top:34px;">
      <h1>Your cart</h1>
    </div>
    <div id="cart-root">
      <div class="skeleton" style="height:90px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:90px;"></div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', loadCart);

async function loadCart() {
  const root = document.getElementById('cart-root');
  try {
    await API.me();
  } catch (e) {
    window.location.href = '/login.html?next=/cart.html';
    return;
  }

  let items, bill, coupons = [], budget = null;
  try {
    [items, bill] = await Promise.all([API.cart(), API.quote(null, NBChoices.all(), (NBLocation.get() || {}).pincode)]);
    coupons = await API.coupons().catch(() => []);
    budget = await API.budget().catch(() => null);
  } catch (e) {
    root.innerHTML = `<p>Could not load your cart right now.</p>`;
    return;
  }

  if (items.length === 0) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="big-emoji">&#128722;</div>
        <h3>Your cart is empty</h3>
        <p>Add a few things from the shop to see them here.</p>
        <a href="/products.html" class="btn btn-primary mt-40">Browse products</a>
      </div>
    `;
    return;
  }

  const hasProblems = bill.problems.length > 0;
  const shopCount = bill.shops.length;

  root.innerHTML = `
    ${bill.priceChangeNotes.length ? `
      <div class="notice warn" id="price-notice">
        <b>Prices changed since you added these items:</b>
        <ul>${bill.priceChangeNotes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>
        <button class="btn btn-sm btn-outline" id="accept-prices-btn">OK, got it</button>
      </div>` : ''}
    ${shopCount > 1 ? `<div class="notice info">Your basket has items from <b>${shopCount} shops</b>. Each shop packs its own items, so you&rsquo;ll get ${shopCount} orders with one payment.</div>` : ''}
    <div class="cart-layout">
      <div id="cart-items-list">
        ${bill.shops.map(sb => shopGroupHtml(sb, items)).join('')}
      </div>
      <aside class="cart-summary">
        ${budgetBoxHtml(budget)}
        <h3 style="font-size:1.1rem;margin-bottom:16px;">Bill details</h3>
        ${billRowsHtml(bill)}
        ${coupons.length ? `
          <div class="offers">
            <div class="offers-title">Offers you can apply at checkout</div>
            ${coupons.map(c => `<div class="offer"><b>${escapeHtml(c.code)}</b>: ${escapeHtml(c.description)}</div>`).join('')}
          </div>` : ''}
        ${hasProblems
          ? `<button class="btn btn-accent btn-block" style="margin-top:16px;" disabled>Fix the issues in your basket to continue</button>`
          : `<a href="/checkout.html" class="btn btn-accent btn-block" style="margin-top:16px;">Proceed to checkout</a>`}
      </aside>
    </div>
  `;
  root.querySelectorAll('.seg button[data-shop]').forEach(btn => btn.addEventListener('click', async () => {
    NBChoices.set(btn.dataset.shop, btn.dataset.value);
    await loadCart();
  }));
  attachCartHandlers();
  document.querySelectorAll('.cart-summary button[data-swap-from]').forEach(btn => btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await API.swapInCart(Number(btn.dataset.swapFrom), Number(btn.dataset.swapTo));
      showToast('Swapped to the cheaper option');
      await loadCart();
      refreshCartCount();
    } catch (e) {
      showToast(e.message);
      btn.disabled = false;
    }
  }));
  const acceptBtn = document.getElementById('accept-prices-btn');
  if (acceptBtn) {
    acceptBtn.addEventListener('click', async () => {
      acceptBtn.disabled = true;
      try { await API.acceptPrices(); await loadCart(); } catch (e) { showToast(e.message); acceptBtn.disabled = false; }
    });
  }
}

/** Budget mode box in the bill: warns before checkout and offers cheaper swaps. */
function budgetBoxHtml(b) {
  if (!b) return '';
  const swaps = b.swaps.map(w => `
    <div class="swap-row" style="padding:8px 0;">
      <div class="info small">${escapeHtml(w.fromName)} &rarr; <b>${escapeHtml(w.to.name)}</b><div class="save">save ${formatRupees(w.saving)}</div></div>
      <button class="btn btn-sm btn-outline" data-swap-from="${w.fromProductId}" data-swap-to="${w.to.id}">Swap</button>
    </div>`).join('');
  if (b.status === 'NO_BUDGET') {
    return swaps ? `<div class="offers" style="margin:0 0 16px;border:none;padding:0;"><div class="offers-title">&#128176; Cheaper swaps</div>${swaps}</div>` : '';
  }
  const tone = b.status === 'OVER' ? 'over' : b.status === 'NEAR' ? 'near' : 'ok';
  const msg = b.status === 'OVER'
    ? `This cart takes you <b>${formatRupees(-Number(b.afterCart))}</b> over your ${escapeHtml(b.month.split(' ')[0])} budget.`
    : `After this order: <b>${formatRupees(b.afterCart)}</b> left of your ${formatRupees(b.budget)} budget.`;
  return `
    <div style="margin-bottom:16px;">
      <div class="budget-banner ${tone}"><span>&#128176;</span><span>${msg} <a href="/budget.html" style="text-decoration:underline;">Details</a></span></div>
      ${swaps}
    </div>`;
}

/** One shop's part of the basket: its items, delivery or pickup, its own fees and problems. */
function shopGroupHtml(sb, items) {
  const mine = items.filter(it => (it.product.shopId || null) === (sb.shopId || null));
  const delivery = sb.fulfilment === 'DELIVERY';
  const addMore = Number(sb.addForFreeDelivery || 0);
  const freeAbove = Number(sb.freeDeliveryAbove || 0);
  const progress = freeAbove > 0 ? Math.min(100, Math.round(((freeAbove - addMore) / freeAbove) * 100)) : 0;
  return `
    <section class="shop-group" aria-label="Items from ${escapeHtml(sb.shopName)}">
      <div class="shop-group-head">
        <div>
          <h3>${sb.shopSlug ? `<a href="/shop.html?s=${encodeURIComponent(sb.shopSlug)}">${escapeHtml(sb.shopName)}</a>` : escapeHtml(sb.shopName)}</h3>
          ${sb.shopId ? `<div class="muted small">${sb.openNow ? 'Open now' : `Opens at ${escapeHtml(sb.openTime)}; your order is packed then`}</div>` : ''}
        </div>
        ${sb.shopId ? `<div class="seg" role="group" aria-label="How to get this shop's order">
          <button type="button" data-shop="${sb.shopId}" data-value="DELIVERY" aria-pressed="${delivery}" ${sb.offersDelivery ? '' : 'disabled title="This shop doesn&rsquo;t deliver"'}>Delivery</button>
          <button type="button" data-shop="${sb.shopId}" data-value="PICKUP" aria-pressed="${!delivery}" ${sb.offersPickup ? '' : 'disabled title="This shop doesn&rsquo;t offer pickup"'}>Pickup</button>
        </div>` : ''}
      </div>
      ${mine.map(cartItemHtml).join('')}
      ${sb.problems.length ? `<div class="group-problems">Fix before checkout:<ul>${sb.problems.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul></div>` : ''}
      <div class="group-bill">
        ${delivery && freeAbove > 0 ? (addMore > 0
          ? `<div class="free-delivery">Add <b>${formatRupees(addMore)}</b> more from this shop for free delivery<div class="progress"><span style="width:${progress}%"></span></div></div>`
          : `<div class="free-delivery ok">Free delivery from this shop</div>`) : ''}
        <div class="summary-row"><span>Items</span><span>${formatRupees(sb.subtotal)}</span></div>
        ${Number(sb.discount) > 0 ? `<div class="summary-row saving"><span>Coupon share</span><span>&minus; ${formatRupees(sb.discount)}</span></div>` : ''}
        <div class="summary-row"><span>${delivery ? 'Delivery fee' : 'Pickup from shop'}</span><span>${Number(sb.deliveryFee) === 0 ? '<b class="free">FREE</b>' : formatRupees(sb.deliveryFee)}</span></div>
        <div class="summary-row" style="color:var(--ink);font-weight:700;"><span>This shop</span><span>${formatRupees(sb.total)}</span></div>
      </div>
    </section>`;
}

function cartItemHtml(item) {
  const p = item.product;
  return `
    <div class="cart-item${p.expired ? ' is-problem' : ''}" data-product-id="${p.id}">
      ${thumbHtml(p).replace('class="thumb"', 'class="thumb" style="width:56px;height:56px;"')}
      <div class="info">
        <h4>${escapeHtml(p.name)}</h4>
        <div class="unit">${escapeHtml(p.unit || '')}, ${formatRupees(p.price)} each
          ${item.priceChanged ? `<span class="price-changed">was ${formatRupees(item.priceWhenAdded)}</span>` : ''}
        </div>
        ${expiryTagHtml(p)}
        <button type="button" class="linklike small save-later" aria-label="Save ${escapeHtml(p.name)} for later">Save for later</button>
      </div>
      <div class="qty-control">
        <button class="qty-minus" aria-label="Decrease quantity">&minus;</button>
        <span>${item.quantity}</span>
        <button class="qty-plus" aria-label="Increase quantity">+</button>
      </div>
      <div class="line-total">${formatRupees(p.price * item.quantity)}</div>
      <button class="remove" aria-label="Remove item">&times;</button>
    </div>
  `;
}

function attachCartHandlers() {
  document.querySelectorAll('.cart-item').forEach(row => {
    const productId = Number(row.dataset.productId);
    const qtySpan = row.querySelector('.qty-control span');
    const buttons = row.querySelectorAll('button');
    const busy = (on) => buttons.forEach(b => { b.disabled = on; });

    row.querySelector('.qty-plus').addEventListener('click', async () => {
      busy(true);
      await updateQty(productId, Number(qtySpan.textContent) + 1);
      busy(false);
    });
    row.querySelector('.qty-minus').addEventListener('click', async () => {
      busy(true);
      const newQty = Number(qtySpan.textContent) - 1;
      if (newQty <= 0) {
        await removeItem(productId);
      } else {
        await updateQty(productId, newQty);
      }
      busy(false);
    });
    row.querySelector('.remove').addEventListener('click', async () => {
      busy(true);
      await removeItem(productId);
    });
    row.querySelector('.save-later').addEventListener('click', async () => {
      busy(true);
      try {
        await API.cartToSaved(productId);
        await loadCart();
        refreshCartCount();
        showToast('Saved for later. Find it under Saved.');
      } catch (e) {
        showToast(e.message);
        busy(false);
      }
    });
  });
}

async function updateQty(productId, quantity) {
  try {
    await API.updateCartQty(productId, quantity);
    await loadCart();
    refreshCartCount();
  } catch (e) {
    showToast(e.message);
  }
}

async function removeItem(productId) {
  try {
    await API.removeFromCart(productId);
    await loadCart();
    refreshCartCount();
    showToast('Item removed');
  } catch (e) {
    showToast(e.message);
  }
}
</script>
</body>
</html>
