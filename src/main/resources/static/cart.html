<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart &mdash; FreshCart</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="signboard">
  <div class="wrap">
    <a href="/" class="brand"><span class="crate">&#127811;</span>FreshCart</a>
    <nav class="nav-links">
      <a href="/products.html">Shop</a>
      <a href="/orders.html" id="nav-orders" style="display:none">My Orders</a>
      <span id="nav-auth-area"><a href="/login.html" id="nav-login">Login</a></span>
      <a href="/cart.html" class="cart-pill">&#128722; Cart <span class="count" id="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="section-heading" style="margin-top:34px;">
      <h2>Your cart</h2>
    </div>
    <div id="cart-root">
      <div class="skeleton" style="height:90px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:90px;"></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    FreshCart &mdash; a student full-stack demo project. Built with Spring Boot, MySQL, and vanilla JS by
    <a href="https://github.com/suryaprasanth740" target="_blank" rel="noopener">Surya Prasanth</a>.
  </div>
</footer>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shop.js"></script>
<script>
document.addEventListener('DOMContentLoaded', loadCart);

async function loadCart() {
  const root = document.getElementById('cart-root');
  try {
    await API.me();
  } catch (e) {
    window.location.href = '/login.html?next=/cart.html';
    return;
  }

  let items, bill, coupons = [];
  try {
    [items, bill] = await Promise.all([API.cart(), API.quote()]);
    coupons = await API.coupons().catch(() => []);
  } catch (e) {
    root.innerHTML = `<p>Could not load your cart right now.</p>`;
    return;
  }

  if (items.length === 0) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="big-emoji">&#128722;</div>
        <h3>Your cart is empty</h3>
        <p>Add a few things from the shop to see them here.</p>
        <a href="/products.html" class="btn btn-primary mt-40">Browse products</a>
      </div>
    `;
    return;
  }

  const hasProblems = bill.problems.length > 0;
  const freeAbove = Number(bill.freeDeliveryAbove);
  const addMore = Number(bill.addForFreeDelivery);
  const progress = Math.min(100, Math.round(((freeAbove - addMore) / freeAbove) * 100));

  root.innerHTML = `
    ${bill.priceChangeNotes.length ? `
      <div class="notice warn" id="price-notice">
        <b>Prices changed since you added these items:</b>
        <ul>${bill.priceChangeNotes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>
        <button class="btn btn-sm btn-outline" id="accept-prices-btn">OK, got it</button>
      </div>` : ''}
    ${hasProblems ? `
      <div class="alert alert-error">
        Please fix these before checkout:
        <ul>${bill.problems.map(pr => `<li>${escapeHtml(pr)}</li>`).join('')}</ul>
      </div>` : ''}
    <div class="cart-layout">
      <div id="cart-items-list">
        ${items.map(cartItemHtml).join('')}
      </div>
      <aside class="cart-summary">
        <h3 style="font-size:1.1rem;margin-bottom:16px;">Bill details</h3>
        ${addMore > 0 ? `
          <div class="free-delivery">
            Add <b>${formatRupees(addMore)}</b> more for <b>FREE delivery</b>
            <div class="progress"><span style="width:${progress}%"></span></div>
          </div>` : `<div class="free-delivery ok">&#127881; You get FREE delivery</div>`}
        ${billRowsHtml(bill)}
        ${coupons.length ? `
          <div class="offers">
            <div class="offers-title">Offers you can apply at checkout</div>
            ${coupons.map(c => `<div class="offer"><b>${escapeHtml(c.code)}</b> &middot; ${escapeHtml(c.description)}</div>`).join('')}
          </div>` : ''}
        ${hasProblems
          ? `<button class="btn btn-accent btn-block" style="margin-top:16px;" disabled>Fix the issues above to continue</button>`
          : `<a href="/checkout.html" class="btn btn-accent btn-block" style="margin-top:16px;">Proceed to checkout</a>`}
      </aside>
    </div>
  `;
  attachCartHandlers();
  const acceptBtn = document.getElementById('accept-prices-btn');
  if (acceptBtn) {
    acceptBtn.addEventListener('click', async () => {
      acceptBtn.disabled = true;
      try { await API.acceptPrices(); await loadCart(); } catch (e) { showToast(e.message); acceptBtn.disabled = false; }
    });
  }
}

function cartItemHtml(item) {
  const p = item.product;
  return `
    <div class="cart-item${p.expired ? ' is-problem' : ''}" data-product-id="${p.id}">
      <div class="emoji">${p.imageEmoji || '\u{1F6D2}'}</div>
      <div class="info">
        <h4>${escapeHtml(p.name)}</h4>
        <div class="unit">${escapeHtml(p.unit || '')} &middot; ${formatRupees(p.price)} each
          ${item.priceChanged ? `<span class="price-changed">was ${formatRupees(item.priceWhenAdded)}</span>` : ''}
        </div>
        ${expiryTagHtml(p)}
      </div>
      <div class="qty-control">
        <button class="qty-minus" aria-label="Decrease quantity">&minus;</button>
        <span>${item.quantity}</span>
        <button class="qty-plus" aria-label="Increase quantity">+</button>
      </div>
      <div class="line-total">${formatRupees(p.price * item.quantity)}</div>
      <button class="remove" aria-label="Remove item">&times;</button>
    </div>
  `;
}

function attachCartHandlers() {
  document.querySelectorAll('.cart-item').forEach(row => {
    const productId = Number(row.dataset.productId);
    const qtySpan = row.querySelector('.qty-control span');
    const buttons = row.querySelectorAll('button');
    const busy = (on) => buttons.forEach(b => { b.disabled = on; });

    row.querySelector('.qty-plus').addEventListener('click', async () => {
      busy(true);
      await updateQty(productId, Number(qtySpan.textContent) + 1);
      busy(false);
    });
    row.querySelector('.qty-minus').addEventListener('click', async () => {
      busy(true);
      const newQty = Number(qtySpan.textContent) - 1;
      if (newQty <= 0) {
        await removeItem(productId);
      } else {
        await updateQty(productId, newQty);
      }
      busy(false);
    });
    row.querySelector('.remove').addEventListener('click', async () => {
      busy(true);
      await removeItem(productId);
    });
  });
}

async function updateQty(productId, quantity) {
  try {
    await API.updateCartQty(productId, quantity);
    await loadCart();
    refreshCartCount();
  } catch (e) {
    showToast(e.message);
  }
}

async function removeItem(productId) {
  try {
    await API.removeFromCart(productId);
    await loadCart();
    refreshCartCount();
    showToast('Item removed');
  } catch (e) {
    showToast(e.message);
  }
}
</script>
</body>
</html>
