# Builds the app and runs ALL automated tests on every push and pull request.
# See the results in: GitHub repo -> Actions tab -> "Build and test".
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and run tests
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log

      # Shows the test totals on the run's Summary page (e.g. "Tests run: 59, Failures: 0").
      - name: Test totals
        if: always()
        run: |
          totals=$(grep -E "^\[(INFO|WARNING|ERROR)\] Tests run:" build.log | tail -1 | sed 's/^\[[A-Z]*\] //')
          echo "::notice title=Test totals::${totals:-no tests ran}"

      # If something fails, puts the compiler errors and failed tests into annotations,
      # so the reason is visible on the Summary page without downloading the log.
      - name: Explain failures
        if: failure()
        run: |
          {
            grep -E "\[ERROR\] .*\.java|COMPILATION ERROR|cannot find symbol|symbol:|location:" build.log | head -40
            # Root causes (e.g. why the app could not start), most specific last
            grep -hE "^Caused by:" target/surefire-reports/*.txt build.log 2>/dev/null | sort | uniq -c | sort -rn | head -12
            grep -E "\[ERROR\] (Tests run|Failures|  [A-Za-z]+Test\.)" build.log | head -40
            grep -hE -A6 "<<< (FAILURE|ERROR)!" target/surefire-reports/*.txt 2>/dev/null | head -120
          } > failures.txt || true
          msg=$(sed 's/%/%25/g; s/\r//g' failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build or test failures::${msg:-See build log}"

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
