# Optional: pings the Render backend every 10 minutes so the free instance
# doesn't fall asleep (it sleeps after 15 minutes idle).
# One always-on free service uses ~744 of Render's 750 free hours per month.
# Disable it any time: GitHub repo → Actions → "Keep backend awake" → Disable workflow.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/categories
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://grocery-web-app-fb3j.onrender.com/api/categories
